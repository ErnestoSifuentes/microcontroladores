<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="425px" version="1.1" viewBox="0 0 1060 425" width="1060px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="423" rx="15" ry="15" stroke="#d5e2e8" stroke-width="2" width="1058" x="1" y="1" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="36" y="48">Registro de dirección y lógica del puerto</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="36" y="79">P1DIR selecciona entrada/salida; P1OUT controla la salida cuando el pin está configurado como salida</text><rect fill="#ebf4f7" height="150" rx="14" ry="14" stroke="#5687a4" stroke-width="2" width="275" x="58" y="145" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="195" y="181">P1DIR.6</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="195" y="211">0 = entrada</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="195" y="240">1 = salida</text><rect fill="#eef7f4" height="150" rx="14" ry="14" stroke="#4d9189" stroke-width="2" width="275" x="390" y="145" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="528" y="181">P1OUT.6</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="528" y="211">0 = nivel bajo</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="528" y="240">1 = nivel alto</text><rect fill="#fcf5e7" height="150" rx="14" ry="14" stroke="#b28d5c" stroke-width="2" width="280" x="730" y="145" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="869" y="181">Pin P1.6</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="869" y="216">Salida digital</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="869" y="244">(si P1SEL lo permite)</text><polyline fill="none" points="336,218 385,218" stroke="#0a777c" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polygon fill="#0a777c" points="385,218 374.4690092573155,223.75310646325045 374.4690092573155,212.24689353674955" /><polyline fill="none" points="667,218 723,218" stroke="#0a777c" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polygon fill="#0a777c" points="723,218 712.4690092573155,223.75310646325045 712.4690092573155,212.24689353674955" /><text fill="#55717e" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="55" y="358">P1IN lee el estado del pin; P1REN habilita una resistencia interna en el modo de entrada apropiado.</text></svg>