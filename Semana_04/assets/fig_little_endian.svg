<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="425px" version="1.1" viewBox="0 0 1060 425" width="1060px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="423" rx="15" ry="15" stroke="#d5e2e8" stroke-width="2" width="1058" x="1" y="1" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="36" y="48">Almacenamiento little-endian</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="36" y="79">Palabra de 16 bits 0xABCD: el byte menos significativo ocupa la dirección menor</text><rect fill="#eff4f9" height="142" rx="14" ry="14" stroke="#6a8baa" stroke-width="2" width="347" x="58" y="149" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="230" y="182">Registro de 16 bits</text><rect fill="#f6fafb" height="52" rx="8" ry="8" stroke="#3e6e92" stroke-width="2" width="111" x="100" y="203" /><text fill="#3e6e92" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="155" y="237">AB</text><rect fill="#f6fafb" height="52" rx="8" ry="8" stroke="#0a777c" stroke-width="2" width="111" x="235" y="203" /><text fill="#0a777c" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="290" y="237">CD</text><polyline fill="none" points="415,221 575,221" stroke="#0a777c" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polygon fill="#0a777c" points="575,221 564.4690092573155,226.75310646325045 564.4690092573155,215.24689353674955" /><rect fill="#f0f7f5" height="178" rx="14" ry="14" stroke="#5b9b91" stroke-width="2" width="403" x="610" y="135" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="810" y="170">Memoria (direcciones crecientes)</text><rect fill="#fff" height="68" rx="7" ry="7" stroke="#8caab0" stroke-width="2" width="146" x="643" y="201" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="716" y="246">CD</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="716" y="296">Dirección A</text><rect fill="#fff" height="68" rx="7" ry="7" stroke="#8caab0" stroke-width="2" width="146" x="825" y="201" /><text fill="#18394a" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="898" y="246">AB</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="898" y="296">Dirección A+1</text><text fill="#55717e" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="55" y="374">El orden de bytes en memoria no invierte los bits dentro de cada byte.</text></svg>